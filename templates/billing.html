<!DOCTYPE html>
<html>
<head>
    <title>Billing / Sale - Shiv Shankar Sales</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4" style="max-width: 500px;">
    <h2>🛒 Create Sale Bill</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Select Item</label>
            <select name="item_id" class="form-control" required>
                {% for item in items %}
                <option value="{{ item['id'] }}">{{ item['name'] }} (Stock: {{ item['stock'] }} | Rate: ₹{{ item['rate'] }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Quantity Sold</label>
            <input type="number" name="quantity" class="form-control" value="1" min="1" required>
        </div>
        <button type="submit" class="btn btn-primary">Complete Sale & Update Stock</button>
        <a href="/" class="btn btn-secondary">Back</a>
    </form>
</body>
</html>
